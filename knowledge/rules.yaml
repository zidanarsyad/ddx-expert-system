# =====================================================================================================
#  DDX-ES rule base: expert IF-THEN rules for the 49 DDXPlus pathologies
#
#  Every rule cites the published criterion, case definition, decision rule or guideline it encodes
#  (section `sources`). The criteria were written for clinicians; here each item is mapped to the
#  closest DDXPlus question. `fidelity` records how faithful that mapping is:
#    faithful  every item of the criterion has a DDXPlus question
#    partial   some items cannot be asked in DDXPlus (vital signs, laboratory tests, duration, examination)
#    proxy     an item is approximated by a related question
#  Certainty factors (cf, MYCIN scale -1..1) express how strongly the source supports the conclusion:
#    0.8-0.9 case definition / criteria met, 0.5-0.7 strongly suggestive pattern, 0.2-0.4 supportive
#    feature or risk factor, negative = evidence against. They are validated against the DDXPlus
#    validation split by scripts/validate_rules.py (precision and lift of every rule).
#
#  This file is the authoring format. scripts/build_kg.py turns it into RDF (kg/rules.ttl); the inference
#  engine reads the rules back from the knowledge graph, not from this file.
#
#  Educational prototype: not a medical device and not for clinical use.
# =====================================================================================================
meta:
  title: DDX-ES clinical rule base
  version: "1.0"
  date: "2026-11-15"
  language: en

